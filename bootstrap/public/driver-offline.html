<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline &mdash; CLSU Moto-Track Driver</title>
<style>
    html, body {
        height: 100%;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        background: #f0fdf4;
        color: #1f2937;
    }
    .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 24px;
        box-sizing: border-box;
    }
    .icon {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #1e6031;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
    }
    .icon svg { width: 36px; height: 36px; }
    h1 { font-size: 1.15rem; margin: 0 0 8px; color: #1e6031; }
    p { font-size: 0.9rem; color: #4b5563; max-width: 320px; line-height: 1.5; margin: 0 0 20px; }
    button {
        background: #1e6031;
        color: #fff;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
    }
    button:active { background: #164f2a; }
</style>
</head>
<body>
    <div class="wrap">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"/>
            </svg>
        </div>
        <h1>You're offline</h1>
        <p>Moto-Track Driver needs an internet connection to load your trip tickets and share your live location. Reconnect and try again.</p>
        <button onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
